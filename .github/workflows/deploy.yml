name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: CRON_SECRET
          script: |
            set -e
            cd /home/cristi/mad-giftcard

            # Sync secrets from GitHub into .env (upsert: remove old line, append new)
            for VAR in CRON_SECRET; do
              VALUE=$(printenv "$VAR")
              if [ -n "$VALUE" ]; then
                sed -i "/^${VAR}=/d" .env 2>/dev/null || true
                echo "${VAR}=${VALUE}" >> .env
              fi
            done

            git pull origin main
            find node_modules -maxdepth 1 -name '.*' -type d -exec rm -rf {} + 2>/dev/null || true
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart mad-giftcard || pm2 start npm --name "mad-giftcard" -- run start
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
